# Paper experiment identifiers -> artifact identifiers, scripts and data.
# The paper's numbers (nine experiments E1-E9; variants are labels such as E3-ABA, E4-PLC, E4-updates, E5-trace, E9-crash) differ from the
# historical identifiers in the script and file names, which are kept so that the SHA-256 manifest
# of data/execution-gap stays valid. Resolve one with:  python scripts/reproduce.py E8
# Data patterns are globs relative to data/execution-gap (all testbed subfolders included).
E1:          {artifact: E1,  scripts: [experiments/run_e1_baselines.py, experiments/run_e1_fpr.py], data: ["**/e1_baselines*.csv", "**/e1_fpr*.csv"]}
E1-classes:  {artifact: E14, scripts: [experiments/run_e14_variants.py], data: ["**/e14_variants*.csv"]}
