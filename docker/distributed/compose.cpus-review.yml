  redis: {cpuset: "2,3"}
  opa: {cpuset: "8,9,10,11"}
  xair: {cpuset: "8,9,10,11"}
  gateway: {cpuset: "13,14,15,16"}
  cell: {cpuset: "17,18"}
  bench: {cpuset: "22,23,24,25"}
